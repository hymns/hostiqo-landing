<svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon - Server with Pulse -->
  <g transform="translate(20, 30)">
    <!-- Outer pulse ring -->
    <circle cx="30" cy="30" r="32" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
    
    <!-- Background circle -->
    <circle cx="30" cy="30" r="26" fill="url(#blueGrad)"/>
    
    <!-- Server rack icon -->
    <!-- Top server -->
    <rect x="18" y="20" width="24" height="6" rx="1.5" fill="white"/>
    <circle cx="21" cy="23" r="1" fill="url(#blueGrad)"/>
    <circle cx="24" cy="23" r="1" fill="url(#blueGrad)"/>
    <rect x="33" y="22" width="6" height="2" rx="1" fill="#10b981"/>
    
    <!-- Middle server -->
    <rect x="18" y="27" width="24" height="6" rx="1.5" fill="white"/>
    <circle cx="21" cy="30" r="1" fill="url(#blueGrad)"/>
    <circle cx="24" cy="30" r="1" fill="url(#blueGrad)"/>
    <rect x="33" y="29" width="6" height="2" rx="1" fill="#10b981"/>
    
    <!-- Bottom server -->
    <rect x="18" y="34" width="24" height="6" rx="1.5" fill="white"/>
    <circle cx="21" cy="37" r="1" fill="url(#blueGrad)"/>
    <circle cx="24" cy="37" r="1" fill="url(#blueGrad)"/>
    <rect x="33" y="36" width="6" height="2" rx="1" fill="#10b981"/>
    
    <!-- Connection lines -->
    <line x1="30" y1="8" x2="30" y2="13" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="17" x2="44" y2="20" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="17" x2="16" y2="20" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text: hostiqo -->
  <text x="90" y="68" font-family="'Montserrat', Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    host<tspan fill="url(#blueGrad)">iqo</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="92" y="86.5" font-family="'Montserrat', Arial, sans-serif" font-size="9" fill="#ffffff" letter-spacing="1.5" opacity="0.8">
    AUTOMATE YOUR SERVER
  </text>
</svg>